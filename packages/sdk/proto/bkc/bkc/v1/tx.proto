syntax = "proto3";

// A trimmed copy of the chain's proto/bkc/bkc/v1/tx.proto.
//
// The one difference, which changes no bytes: the cosmos_proto, amino and gogoproto
// options are dropped, so this generates offline instead of pulling the Buf registry.
package bkc.bkc.v1;

option go_package = "BKC/x/bkc/types";

message MsgExecuteEvmCall {
  string sender = 1;
  string to = 2;
  bytes data = 3;
  string value = 4;
  uint64 gas_limit = 5;
  string max_fee_per_gas = 6;
  string max_priority_fee_per_gas = 7;
  uint64 call_nonce = 8;
}

message MsgExecuteEvmCallResponse {
  bytes ret = 1;
  uint64 gas_used = 2;
  string vm_error = 3;
  bytes tx_hash_compat = 4;
  repeated WrappedEVMLog logs = 5;
}

message WrappedEVMLog {
  string address = 1;
  repeated string topics = 2;
  bytes data = 3;
  uint64 block_number = 4;
  string tx_hash = 5;
  uint64 tx_index = 6;
  string block_hash = 7;
  uint64 index = 8;
  bool removed = 9;
  uint64 block_timestamp = 10;
}
